name: Publish Miracle Klipper Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download previously successful Miracle Klipper build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p download dist
          gh run download 40090771585 --repo "$GITHUB_REPOSITORY" --dir download
          find download -type f -maxdepth 3 -print
          find download -type f \( -name '*.tar.xz' -o -name '*.sha256' \) -exec cp {} dist/ \;
          ls -lh dist
          test -n "$(find dist -maxdepth 1 -name '*.tar.xz' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.sha256' -print -quit)"

      - name: Publish version v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0"
          NOTES="Première version publiée de Miracle Klipper. Image rootfs Debian Bookworm ARM64 issue du build validé GitHub Actions. Archive compressée au format .tar.xz accompagnée de son fichier SHA-256."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.xz dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.tar.xz dist/*.sha256 \
              --title "Miracle Klipper v0.1.0" \
              --notes "$NOTES"
          fi
