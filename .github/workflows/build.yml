name: Validate and build Miracle Klipper Debian rootfs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Debian suite
        required: true
        default: bookworm
        type: choice
        options: [bookworm]
      architecture:
        description: Target architecture
        required: true
        default: arm64
        type: choice
        options: [amd64, arm64, armhf]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell scripts and project constraints
        run: bash ./tests/validate.sh

  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install rootfs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support xz-utils
      - name: Enable foreign architecture emulators
        run: |
          sudo update-binfmts --enable qemu-aarch64 || true
          sudo update-binfmts --enable qemu-arm || true
      - name: Build rootfs
        run: |
          sudo env ARCH="${{ inputs.architecture }}" DEBIAN_SUITE="${{ inputs.suite }}" bash ./scripts/build-rootfs.sh
      - name: Upload rootfs archive
        uses: actions/upload-artifact@v4
        with:
          name: miracle-klipper-debian-${{ inputs.suite || 'bookworm' }}-${{ inputs.architecture || 'arm64' }}
          path: |
            dist/*.tar.xz
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping publication."
          else
            gh release create "$TAG" dist/*.tar.xz dist/*.sha256 \
              --title "Miracle Klipper v0.1.0" \
              --notes "Première version publiée de Miracle Klipper. Image rootfs Debian Bookworm ARM64 construite et validée par GitHub Actions. Archive compressée au format .tar.xz accompagnée de son fichier SHA-256."
          fi
